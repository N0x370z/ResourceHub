<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ResourceHub</title>
    <link rel="stylesheet" href="https://bootswatch.com/4/superhero/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            max-width: 450px;
            width: 100%;
        }
        
        .card {
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: none;
            overflow: hidden;
            background: white;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border: none;
        }
        
        .card-header h2 { margin: 0; font-weight: 700; }
        .card-header .logo { font-size: 4rem; margin-bottom: 10px; }
        
        .card-body {
            padding: 40px;
            color: #333; 
        }
        
        .form-group label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            font-size: 14px;
            transition: all 0.3s;
            background-color: #fff !important;
            color: #333 !important;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            background-color: #fff !important;
            color: #333 !important;
        }
        

        .input-icon {
            position: relative;
        }
        
        /* Icono izquierdo */
        .input-icon > i.fas:not(.password-toggle) {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            z-index: 5;
            pointer-events: none;
        }
        
        .input-icon .form-control {
            padding-left: 45px;
            padding-right: 45px; 
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            z-index: 10;
            padding: 5px;
        }
        
        .password-toggle:hover {
            color: #667eea;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
            margin-top: 20px;
            color: white;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        
        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #e0e0e0;
        }
        
        .divider span {
            background: white; padding: 0 15px; position: relative; color: #666;
        }
        
        .signup-link a { color: #667eea; font-weight: 600; text-decoration: none; }
        .back-link a { color: #999; text-decoration: none; font-size: 0.9rem; }
        .back-link { text-align: center; margin-top: 15px; }
        
        .status-bar { font-size: 0.8rem; margin-top: 5px; min-height: 20px; }
        .status-bar.error { color: #dc3545; }
        
        .alert-custom { display: none; margin-bottom: 20px; border-radius: 10px; }
        .alert-custom.show { display: block; }
        .custom-control-label { color: #555; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="card-header">
                <div class="logo"><i class="fas fa-folder-open"></i></div>
                <h2>ResourceHub</h2>
                <p class="mb-0">Inicia sesión en tu cuenta</p>
            </div>
            <div class="card-body">
                <div class="alert alert-danger alert-custom" id="alert-box">
                    <i class="fas fa-exclamation-circle"></i> <span id="alert-message"></span>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-icon">
                            <i class="fas fa-at"></i>
                            <input type="email" class="form-control" id="email" 
                                   placeholder="tu@email.com" required autocomplete="email">
                        </div>
                        <div class="status-bar" id="status-email"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-icon">
                            <i class="fas fa-key"></i>
                            <input type="password" class="form-control" id="password" 
                                   placeholder="Tu contraseña" required autocomplete="current-password">
                            <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                        </div>
                        <div class="status-bar" id="status-password"></div>
                    </div>

                    <div class="custom-control custom-checkbox mb-3">
                        <input type="checkbox" class="custom-control-input" id="remember">
                        <label class="custom-control-label" for="remember">Recordarme</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login" id="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>

                <div class="divider"><span>¿No tienes cuenta?</span></div>
                <div class="signup-link">
                    <a href="signup.html">Crear una cuenta nueva</a>
                </div>
                <div class="back-link">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#toggle-password').on('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const passwordField = $('#password');
                const icon = $(this);
                
                if (passwordField.attr('type') === 'password') {
                    passwordField.attr('type', 'text');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    passwordField.attr('type', 'password');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });

            $('#login-form').on('submit', function(e) {
                e.preventDefault();
                const email = $('#email').val().trim();
                const password = $('#password').val();
                
                if (!email || !password) { showAlert('Por favor completa todos los campos'); return; }
                
                const btn = $('#btn-login');
                btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Entrando...');
                
                $.ajax({
                    url: 'backend/auth-login.php',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ email: email, password: password }),
                    success: function(response) {
                        if (response.status === 'success') {
                            if (response.data && response.data.rol === 'admin') {
                                window.location.href = 'dashboard.html';
                            } else {
                                window.location.href = 'user-catalog.html';
                            }
                        } else {
                            showAlert(response.message);
                            btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt"></i> Iniciar Sesión');
                        }
                    },
                    error: function(xhr) {
                        showAlert('Error de conexión o credenciales incorrectas');
                        btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt"></i> Iniciar Sesión');
                    }
                });
            });

            function showAlert(msg) {
                $('#alert-message').text(msg);
                $('#alert-box').addClass('show');
                setTimeout(() => $('#alert-box').removeClass('show'), 4000);
            }
        });
    </script>
</body>
</html>
