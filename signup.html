<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - ResourceHub</title>
    <link rel="stylesheet" href="https://bootswatch.com/4/superhero/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .signup-container { max-width: 500px; width: 100%; }
        
        .card {
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: none;
            overflow: hidden;
            background: white;
        }
        
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 30px; text-align: center;
        }
        
        .card-header h2 { margin: 0; font-weight: 700; }
        .card-header .logo { font-size: 4rem; margin-bottom: 10px; }
        
        .card-body { padding: 40px; color: #333; }
        
        .form-group label { font-weight: 600; color: #2c3e50; margin-bottom: 8px; }
        
        .form-control {
            border-radius: 10px; padding: 12px 15px; border: 2px solid #e0e0e0;
            font-size: 14px; transition: all 0.3s;
            background-color: #fff !important; color: #333 !important;
        }
        .form-control:focus {
            border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .input-icon { position: relative; }
        
        .input-icon > i.fas:not(.password-toggle) {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #999; z-index: 5; pointer-events: none;
        }
        
        .input-icon .form-control { padding-left: 45px; padding-right: 45px; }
        
        .password-toggle {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #999; z-index: 10; padding: 5px;
        }
        .password-toggle:hover { color: #667eea; }
        
        .btn-signup {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; padding: 14px; font-size: 16px; font-weight: 600;
            border-radius: 10px; width: 100%; margin-top: 20px; color: white;
            cursor: pointer;
        }
        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); color: white; }
        
        .btn-signup:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .divider { text-align: center; margin: 25px 0; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #e0e0e0; }
        .divider span { background: white; padding: 0 15px; position: relative; color: #666; }
        
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #667eea; font-weight: 600; text-decoration: none; }
        .back-link { text-align: center; margin-top: 15px; }
        .back-link a { color: #999; text-decoration: none; font-size: 0.9rem; }
        
        .status-bar { font-size: 0.8rem; margin-top: 5px; min-height: 20px; }
        .status-bar.error { color: #dc3545; }
        .status-bar.success { color: #28a745; }
        
        .alert-custom { display: none; margin-bottom: 20px; border-radius: 10px; }
        .alert-custom.show { display: block; }
        .custom-control-label { color: #555; cursor: pointer; }
        
        .password-requirements { font-size: 0.75rem; margin-top: 8px; color: #666; }
        .password-requirements ul { list-style: none; padding: 0; margin: 5px 0 0 0; }
        .password-requirements li.valid { color: #28a745; }
        .password-requirements li.invalid { color: #dc3545; }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="card">
            <div class="card-header">
                <div class="logo"><i class="fas fa-user-plus"></i></div>
                <h2>ResourceHub</h2>
                <p class="mb-0">Crea tu cuenta</p>
            </div>
            <div class="card-body">
                <div class="alert alert-danger alert-custom" id="alert-error"><i class="fas fa-exclamation-circle"></i> <span id="error-message"></span></div>
                <div class="alert alert-success alert-custom" id="alert-success"><i class="fas fa-check-circle"></i> <span id="success-message"></span></div>

                <form id="signup-form">
                    <div class="form-group">
                        <label for="nombre">Nombre Completo</label>
                        <div class="input-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-control" id="nombre" placeholder="Juan Pérez" required>
                        </div>
                        <div class="status-bar" id="status-nombre"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <div class="input-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-control" id="email" placeholder="tu@email.com" required>
                        </div>
                        <div class="status-bar" id="status-email"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" id="password" placeholder="Tu contraseña" required>
                            <i class="fas fa-eye password-toggle" id="toggle-password"></i>
                        </div>
                        <div class="password-requirements">
                            <small>Requisitos:</small>
                            <ul>
                                <li id="req-length" class="invalid">Mínimo 8 caracteres</li>
                                <li id="req-uppercase" class="invalid">Una mayúscula</li>
                                <li id="req-number" class="invalid">Un número</li>
                            </ul>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password_confirm">Confirmar Contraseña</label>
                        <div class="input-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" id="password_confirm" placeholder="Confirma contraseña" required>
                            <i class="fas fa-eye password-toggle" id="toggle-password-confirm"></i>
                        </div>
                        <div class="status-bar" id="status-password-confirm"></div>
                    </div>

                    <div class="custom-control custom-checkbox mb-3">
                    <input type="checkbox" class="custom-control-input" id="terms" required>
                    <label class="custom-control-label" for="terms">
                        Acepto los <a href="terminos.txt" target="_blank" style="color: #667eea; text-decoration: underline;">términos y condiciones</a>
                    </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-signup" id="btn-signup" disabled>
                        <i class="fas fa-user-plus"></i> Crear Cuenta
                    </button>
                </form>

                <div class="divider"><span>¿Ya tienes cuenta?</span></div>
                <div class="login-link"><a href="login.html">Iniciar sesión</a></div>
                <div class="back-link"><a href="index.html"><i class="fas fa-arrow-left"></i> Volver al inicio</a></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script>
        $(document).ready(function() {
            // Password Toggle
            $('.password-toggle').on('click', function(e) {
                e.preventDefault(); e.stopPropagation();
                const targetId = $(this).attr('id').replace('toggle-', '');
                const input = $('#' + targetId);
                const icon = $(this);
                if (input.attr('type') === 'password') {
                    input.attr('type', 'text'); icon.removeClass('fa-eye').addClass('fa-eye-slash');
                } else {
                    input.attr('type', 'password'); icon.removeClass('fa-eye-slash').addClass('fa-eye');
                }
            });

            $('#password').on('keyup', function() {
                const val = $(this).val();
                $('#req-length').toggleClass('valid', val.length >= 8).toggleClass('invalid', val.length < 8);
                $('#req-uppercase').toggleClass('valid', /[A-Z]/.test(val)).toggleClass('invalid', !/[A-Z]/.test(val));
                $('#req-number').toggleClass('valid', /[0-9]/.test(val)).toggleClass('invalid', !/[0-9]/.test(val));
            });

            $('#terms').on('change', function() {
                if ($(this).is(':checked')) {
                    $('#btn-signup').prop('disabled', false);
                } else {
                    $('#btn-signup').prop('disabled', true);
                }
            });

            $('#signup-form').on('submit', function(e) {
                e.preventDefault();
                
                const data = {
                    nombre: $('#nombre').val(),
                    email: $('#email').val(),
                    password: $('#password').val(),
                    password_confirm: $('#password_confirm').val()
                };

                if(data.password !== data.password_confirm) {
                    $('#status-password-confirm').text('Las contraseñas no coinciden').addClass('error');
                    return;
                }

                const btn = $('#btn-signup');
                btn.prop('disabled', true).html('Creando...');

                $.ajax({
                    url: 'backend/auth-signup.php',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(res) {
                        $('#alert-success').addClass('show');
                        $('#success-message').text('Cuenta creada. Redirigiendo...');
                        setTimeout(() => window.location.href = 'login.html', 2000);
                    },
                    error: function(xhr) {
                        $('#alert-error').addClass('show');
                        const msg = xhr.responseJSON ? xhr.responseJSON.message : 'Error al registrar';
                        $('#error-message').text(msg);
                        btn.prop('disabled', false).html('<i class="fas fa-user-plus"></i> Crear Cuenta');
                        setTimeout(() => $('#alert-error').removeClass('show'), 4000);
                    }
                });
            });
        });
    </script>
</body>
</html>
